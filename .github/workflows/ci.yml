name: Festify CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check .

      - name: Run Test Suite with Pytest & Coverage
        env:
          FESTIFY_ENVIRONMENT: testing
          FESTIFY_SECRET_KEY: testing-secret-key-for-automated-ci-runs
          FESTIFY_LLM_PROVIDER: mock
          FESTIFY_DATABASE_URL: sqlite:///:memory:
        run: |
          pytest -v --cov=app --cov-report=term-missing tests/

  container-build:
    name: Verify Docker Container Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: festify:latest
